services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: instalink
      POSTGRES_USER: instalink
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instalink -d instalink"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-dev-data:
